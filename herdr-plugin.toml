id = "portboard"
name = "Portboard"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Inspect, open, and start development processes for the current workspace."
platforms = ["linux"]

[[build]]
command = ["cargo", "build", "--release"]

[[actions]]
id = "open"
title = "Portboard: current workspace"
contexts = ["workspace"]
command = ["./target/release/portboard", "plugin-open"]

[[actions]]
id = "open-url"
title = "Portboard: open clicked URL"
contexts = ["workspace"]
command = ["./target/release/portboard", "open-url"]

[[link_handlers]]
id = "localhost"
title = "Open localhost URL with Portboard"
pattern = "^https?://(localhost|127\\.0\\.0\\.1|\\[::1\\])(:[0-9]+)?([/?#].*)?$"
action = "open-url"

[[panes]]
id = "current"
title = "Portboard"
placement = "popup"
width = "80%"
height = "70%"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/portboard\" panel"]
