[package]
name = "portboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Inspect and open development processes for the current workspace"
license = "MIT"

[[bin]]
name = "portboard"
path = "src/main.rs"

[lib]
name = "portboard"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3"
